name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov

  evaluation:
    name: measured quality (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: JSON scoring against scikit-learn, robustness, speed
        run: |
          python tools/evaluate.py | tee eval.txt
          tail -n 1 eval.txt | grep -qx OK

  windows:
    name: test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[train]"
      - name: Train a model on made-up URLs
        run: |
          urlclf synth --out synth.csv -n 4000
          urlclf train --data synth.csv --out model.json --no-compare > /dev/null
      - run: docker build -t urlclf .
      - name: Score with a mounted model, as an ordinary user
        run: |
          docker run --rm -v "$PWD/model.json:/m/model.json:ro" urlclf score --model /m/model.json --format json "http://paypal.com.secure-login-x9.tk/verify/12345.php" "https://www.kalomi.com/about" > out.json
          python3 -c "import json; r=json.load(open('out.json'))['results']; assert [x['verdict'] for x in r]==['phishing','legitimate'], r"
      - name: The bundled model, with no file mounted
        run: |
          docker run --rm urlclf score --format json "http://203.0.113.7/login.php" "https://www.example.org/docs/index.html" > bundled.json
          python3 -c "import json; r=json.load(open('bundled.json'))['results']; assert [x['verdict'] for x in r]==['phishing','legitimate'], r"
      - name: Local API from the image
        run: |
          docker run -d --name api -p 127.0.0.1:8080:8080 -v "$PWD/model.json:/m/model.json:ro" urlclf serve --model /m/model.json --host 0.0.0.0
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/health && break; sleep 1; done
          curl -fs -X POST http://127.0.0.1:8080/score -d '{"urls":["http://1.2.3.4/login.php"]}' | tee api.json
          docker rm -f api
